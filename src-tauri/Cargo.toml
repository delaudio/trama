[package]
name = "trama"
version = "0.1.0"
description = "Local creative workflows for AI image direction"
authors = ["trama contributors"]
edition = "2021"

[lib]
name = "trama_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
